apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-notifications
  namespace: os
spec:
  podSelector:
    matchLabels:
      os.askgina/role: server
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
