# The public edge: Caddy with the PUBLIC_ORIGIN site of deploy/Caddyfile (files/Caddyfile, kept
# equal to it by deploy/k8s/test/files.test.ts). It refuses the Workflow delivery routes and
# forwards everything else to the server. It listens on plain HTTP 8080; TLS is the job of
# whatever publishes the Service (a load balancer or an ingress), which adds one entry to
# X-Forwarded-For, so set FORWARDED_HOPS=2 in `os-server` then.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: os
  labels:
    app.kubernetes.io/name: edge
    os.askgina/role: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        os.askgina/role: edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The Caddy binary carries this file capability, and a binary whose file capability
            # is outside the bounding set does not start; it grants nothing to a non-root user.
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddyfile
          configMap:
            name: edge-caddyfile
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: os
  labels:
    app.kubernetes.io/name: edge
spec:
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 8080
      targetPort: http
