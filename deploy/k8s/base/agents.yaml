# The agent gateway: Caddy with deploy/Caddyfile.agents (files/Caddyfile.agents, kept equal to
# it by deploy/k8s/test/files.test.ts). It forwards /mcp to the server with the public host and
# answers 404 to everything else. Agents run as pods labelled `os.askgina/role: agent` in this
# namespace; they get no DNS and reach the gateway at http://$(AGENT_GATEWAY_SERVICE_HOST)/mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  namespace: os-agents
  labels:
    app.kubernetes.io/name: agent-gateway
    os.askgina/role: agent-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-gateway
        os.askgina/role: agent-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        # Caddyfile.agents listens on :80. This namespaced, `restricted`-allowed sysctl lets the
        # non-root user bind it without any capability.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: caddy
          image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: os-agent-gateway
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddyfile
          configMap:
            name: agent-gateway-caddyfile
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
  namespace: os-agents
  labels:
    app.kubernetes.io/name: agent-gateway
spec:
  selector:
    app.kubernetes.io/name: agent-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Caddyfile.agents names its upstream `server`, as on Compose. In this namespace that name is
# this alias of the server's Service; only the gateway may resolve it.
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: os-agents
  labels:
    app.kubernetes.io/name: server-alias
spec:
  type: ExternalName
  externalName: server.os.svc.cluster.local
