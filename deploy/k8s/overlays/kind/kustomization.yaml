# The CI and evaluation stack on kind: the control plane, the signer and its confirmation page in
# the cluster (decision D4 allows that for CI and evaluation only), one Postgres and a local
# chain. e2e/run-k8s.sh builds the images, loads them into kind, creates the Secrets with
# deploy/k8s/make-secrets.sh, applies this overlay and publishes the two origins on localhost
# with `kubectl port-forward`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/signer-in-cluster
  - ../../components/postgres-single
  - ../../components/dev-chain

# Built from apps/*/Dockerfile and loaded with `kind load docker-image`, never pulled.
images:
  - name: askgina-os-server
    newTag: local
  - name: askgina-os-signer
    newTag: local
  - name: askgina-os-approve
    newTag: local

# The origins `kubectl port-forward` publishes: the edge on 55902, the confirmation page's edge
# on 55903, as the Compose release gates use them (e2e/run.sh). Set here once, in `os-server`;
# components/signer-in-cluster copies them to the signer and `approve`. Only ConfigMaps of
# ../../base can be merged into here: Kustomize runs these generators before the components.
configMapGenerator:
  - name: os-server
    namespace: os
    behavior: merge
    literals:
      - PUBLIC_ORIGIN=http://localhost:55902
      - WEBAUTHN_RP_ID=localhost
      - APPROVE_ORIGIN=http://localhost:55903
  - name: os-agent-gateway
    namespace: os-agents
    behavior: merge
    literals:
      - PUBLIC_HOST=localhost:55902
