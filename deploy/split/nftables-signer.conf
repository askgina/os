#!/usr/sbin/nft -f
# Example rules for the signer's host in a split deployment (deploy/split/signer.compose.yaml):
# the signer opens no connection to anything. Its only network with a route out is the bridge
# `os-signer0` (`signer-wire`), which carries its published port; these rules drop every new
# connection that would leave that bridge, and let the answers to the control host's
# connections through. The `approve` service is on `internal` networks only, which Docker gives
# no route out. The edge (Caddy) is the one container that may open a connection out, to the
# ACME server for the confirmation page's certificate.
#
#   sudo nft -f deploy/split/nftables-signer.conf        apply (again: replaces the table)
#   sudo nft delete table inet os_signer_host             remove
#
# A table of its own, at a priority ahead of Docker's rules, so Docker rewriting its own rules
# never removes these. Load it at boot (for example from /etc/nftables.conf).
table inet os_signer_host
delete table inet os_signer_host

table inet os_signer_host {
	chain forward {
		type filter hook forward priority filter - 10; policy accept;
		# Traffic between containers on the same bridge is not a connection out.
		iifname "os-signer0" oifname != "os-signer0" ct state new counter drop
	}

	chain input {
		type filter hook input priority filter - 10; policy accept;
		# Nor may the signer open a connection to the host itself.
		iifname "os-signer0" ct state new counter drop
	}
}
