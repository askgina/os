# Overlay for a host with a real DNS name pointing at it:
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --build
# Caddy obtains and renews certificates itself, so ports 80 and 443 must be reachable. The
# confirmation page gets its own site at APPROVE_ORIGIN: `https://approve.<host>` with its own DNS
# record (served on 443), or `https://<host>:<port>` with APPROVE_TLS_PORT set to that port.
services:
  caddy:
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${OS_HOSTNAME:?set OS_HOSTNAME in .env}
      APPROVE_SITE_ADDRESS: ${APPROVE_ORIGIN:?set APPROVE_ORIGIN in .env}
    tmpfs: !override ["/tmp", "/config"]
    volumes:
      - caddy-data:/data
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "${APPROVE_TLS_PORT:-8443}:${APPROVE_TLS_PORT:-8443}"

  server:
    environment:
      PUBLIC_ORIGIN: https://${OS_HOSTNAME:?set OS_HOSTNAME in .env}
      APPROVE_ORIGIN: ${APPROVE_ORIGIN:?set APPROVE_ORIGIN in .env}

  approve:
    environment:
      APPROVE_ORIGIN: ${APPROVE_ORIGIN:?set APPROVE_ORIGIN in .env}

  signer:
    environment:
      WEBAUTHN_ORIGINS: https://${OS_HOSTNAME:?set OS_HOSTNAME in .env}
      SIGNER_APPROVAL_ORIGIN: ${APPROVE_ORIGIN:?set APPROVE_ORIGIN in .env}
      SIGNER_RETURN_ORIGIN: https://${OS_HOSTNAME:?set OS_HOSTNAME in .env}

  agent-gateway:
    environment:
      PUBLIC_HOST: ${OS_HOSTNAME:?set OS_HOSTNAME in .env}

volumes:
  caddy-data: {}
