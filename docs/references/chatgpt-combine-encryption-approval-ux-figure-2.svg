<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" width="100%" viewBox="0 0 340 344" style="color:rgb(13, 13, 13)" xmlns="http://www.w3.org/2000/svg"><rect x="13" y="8" width="314" height="47" rx="8" fill="#64748b" fill-opacity=".09" stroke="#64748b" stroke-opacity=".6"/><text x="26" y="26" font-size="12" fill="currentColor" font-weight="600">1 · Agent requests operation</text><text x="26" y="42" font-size="10" fill="currentColor">Structured transaction intent</text><path d="M170 55 v10" stroke="#94a3b8" stroke-width="1.5"/><rect x="13" y="65" width="314" height="47" rx="8" fill="#0d9488" fill-opacity=".09" stroke="#0d9488" stroke-opacity=".6"/><text x="26" y="83" font-size="12" fill="currentColor" font-weight="600">2 · Workflow pauses</text><text x="26" y="99" font-size="10" fill="currentColor">Persist intent + request approval</text><path d="M170 112 v10" stroke="#94a3b8" stroke-width="1.5"/><rect x="13" y="122" width="314" height="47" rx="8" fill="#2563eb" fill-opacity=".09" stroke="#2563eb" stroke-opacity=".6"/><text x="26" y="140" font-size="12" fill="currentColor" font-weight="600">3 · Human uses passkey</text><text x="26" y="156" font-size="10" fill="currentColor">Fingerprint / face / PIN</text><path d="M170 169 v10" stroke="#94a3b8" stroke-width="1.5"/><rect x="13" y="179" width="314" height="47" rx="8" fill="#2563eb" fill-opacity=".09" stroke="#2563eb" stroke-opacity=".6"/><text x="26" y="197" font-size="12" fill="currentColor" font-weight="600">4 · Verify WebAuthn assertion</text><text x="26" y="213" font-size="10" fill="currentColor">Challenge + origin + permission</text><path d="M170 226 v10" stroke="#94a3b8" stroke-width="1.5"/><rect x="13" y="236" width="314" height="47" rx="8" fill="#0d9488" fill-opacity=".09" stroke="#0d9488