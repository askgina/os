# Overlay for the release gates only: lets the tests reach the database (to scan it for
# plaintext), the local chain (to check balances and to hold back mining) and a webhook receiver
# (to check what the server notifies), and lets a destroy time be seconds ahead. Never use it for
# a real deployment.
services:
  signer:
    environment:
      # The lifecycle gates retire wallets and delete workspaces and then wait for the keys to be
      # destroyed, so they need a destroy time a few seconds ahead. Every real deployment keeps a
      # minimum delay (seven days by default, deploy/README.md).
      SIGNER_MIN_DESTROY_DELAY_SECONDS: "0"
  postgres:
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-55900}:5432"
  anvil:
    ports:
      - "127.0.0.1:${E2E_ANVIL_PORT:-55901}:8545"
  caddy:
    environment:
      # Every request, its status and its duration, in the logs a failed gate prints.
      ACCESS_LOG: log

  # The operator's webhook, as an operator would run one next to the stack: on the `control`
  # network, where the server reaches it. It records every request and answers 200, so every
  # approval of every gate is announced to it and accepted (see e2e/src/webhook-receiver.mts).
  # Paths are relative to the project directory, the repository root.
  webhook-receiver:
    image: node:26-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    command: ["node", "/receiver/webhook-receiver.mts"]
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    volumes:
      - ./e2e/src/webhook-receiver.mts:/receiver/webhook-receiver.mts:ro
    ports:
      - "127.0.0.1:${E2E_WEBHOOK_PORT:-55904}:8080"
    networks: [control]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 1s
      timeout: 3s
      retries: 30

  server:
    environment:
      NOTIFY_WEBHOOK_URL: http://webhook-receiver:8080/hook
      # A stuck payment is repriced by itself 45 seconds after its newest attempt (180 by
      # default): late enough that a person's "Speed up", allowed 15 seconds after the newest
      # attempt, is the only possible cause of an attempt in between, so the gates know whose
      # each attempt is.
      REPRICE_AFTER_SECONDS: "45"
    depends_on:
      webhook-receiver: { condition: service_healthy }
