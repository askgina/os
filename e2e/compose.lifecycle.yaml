# Overlay for the lifecycle gates' own stack only (e2e/run.sh, with e2e/compose.e2e.yaml): Web
# Push on, so the gate that erases a person can show that a device they added through the API is
# gone afterwards. No other stack turns it on, so every other gate runs as a deployment without
# Web Push does. The only push service allowed is a `.test` name, which never resolves: nothing
# is sent anywhere, and every delivery to it fails and is retried. Never use it for a real
# deployment.
services:
  server:
    environment:
      WEB_PUSH_ENABLED: "1"
      # Required with Web Push when PUBLIC_ORIGIN is not https (apps/server/src/config.ts).
      WEB_PUSH_SUBJECT: mailto:operator@example.test
      WEB_PUSH_ENDPOINT_HOSTS: push.example.test
