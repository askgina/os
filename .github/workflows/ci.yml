name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Approvals are made only on the signer's confirmation page (specs/trusted-display.md,
      # milestone 3). This fails when a name of the removed approval prompt on the control
      # plane's own page comes back in code or configuration; prose may name it as history.
      # git grep exits 0 on a match, 1 on none, above 1 on an error.
      - name: The control plane has no approval prompt
        run: |
          set +e
          git grep -nE 'startApproval|startCeremony|ApproveRequest|WEBAUTHN_ORIGINS|signWithPasskey\(options\)|/approvals/:approvalId/(options|approve)' \
            -- apps packages e2e examples deploy compose.yaml compose.tls.yaml .env.example ':!*.md'
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "a name of the removed control-plane approval prompt is back" >&2
            exit 1
          fi
          [ "$status" -eq 1 ]
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck

  # The World and key packages as another repository gets them: built, packed with their
  # published manifests, installed from the tarballs and imported with Node. The `packages`
  # workflow does the same on a `world-v*` tag and then publishes; this job never publishes.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/keys
      - run: bun run build
        working-directory: packages/world
      - run: node scripts/pack-packages.mjs
      - run: node scripts/smoke-packed-world.mjs
      # The packed tarballs and their digests, for a repository that vendors them by digest.
      - run: sha256sum .packs/*.tgz | tee .packs/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-packages
          path: .packs/
          include-hidden-files: true
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run services:up
      - run: bun run build:workflows
        working-directory: apps/server
      - run: bun run test
      # The eve example's image is not part of the stack; this only proves it still builds.
      - run: docker build -f examples/eve-agent/Dockerfile -t os-eve-agent:ci .
      # Nor is the ntfy sidecar's; its tests ran in `bun run test` above.
      - run: docker build -f examples/ntfy-sidecar/Dockerfile -t os-ntfy-sidecar:ci .
      - if: failure()
        run: docker compose -f deploy/compose.test.yaml logs --no-color
      - if: always()
        run: bun run services:down

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      # The first-day journey on a phone and a desktop, light and dark, and on a phone with wider
      # letters than any installed font, against the fixture API under the production
      # Content-Security-Policy.
      - run: bunx playwright test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-traces
          path: apps/web/test-results
          retention-days: 7

  # The same gates three ways: on x86-64, on arm64 (the images and the wallet library's native
  # module are built for the runner's architecture), and the browser gate over HTTPS.
  stack:
    name: stack (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, runner: ubuntu-latest, tls: "0" }
          - { name: arm64, runner: ubuntu-24.04-arm, tls: "0" }
          - { name: tls, runner: ubuntu-latest, tls: "1" }
          # The signer and its confirmation page in a second Compose project, as on their own
          # host (deploy/split), joined to the control plane only by mutual TLS.
          - { name: split, runner: ubuntu-latest, tls: "0", split: "1" }
          # Two server replicas on one database behind both edges: the replica gates
          # (e2e/test/replicas.spec.ts), then every release gate on a fresh two-replica stack.
          - { name: replicas, runner: ubuntu-latest, tls: "0", replicas: "1" }
          # The key-encryption key in OpenBao Transit, with no keyring file: the OpenBao gates
          # (e2e/test/openbao.spec.ts), then every release gate on a fresh stack of that kind.
          - { name: openbao, runner: ubuntu-latest, tls: "0", openbao: "1" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      E2E_TLS: ${{ matrix.tls }}
      E2E_SPLIT: ${{ matrix.split || '0' }}
      E2E_REPLICAS: ${{ matrix.replicas || '0' }}
      E2E_OPENBAO: ${{ matrix.openbao || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Install the browser the release gates drive
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # The split gate applies deploy/split/nftables-signer.conf with `sudo nft`.
      - name: Install nftables for the split gates
        if: matrix.split == '1'
        run: command -v nft >/dev/null || sudo apt-get install -y --no-install-recommends nftables
      # Builds the images, starts the whole stack as a throwaway Compose project, runs the
      # release gates against it, prints the server and signer logs on failure, and removes it.
      - name: Release gates against the real stack
        run: ./e2e/run.sh

  # The control plane on Kubernetes (specs/beyond-one-machine.md, milestone 5): the manifests
  # under deploy/k8s validated against Kubernetes 1.37, then the kind overlay on a throwaway kind
  # cluster with the images built here, the isolation probe (and its control: it must fail with
  # a policy deleted), and the Kubernetes gate (e2e/test/kubernetes.spec.ts). kind's network
  # plugin, kindnet, enforces NetworkPolicies since kind v0.24.0 (kube-network-policies) and
  # fails open when its queue is not served, which the probe's control would show.
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The schemas kubeconform reads, from one commit of yannh/kubernetes-json-schema.
      KUBECONFORM_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/2bfaff3898a7a4fa4e4760da3d2656211c9b4c71/{{ .NormalizedKubernetesVersion }}-standalone{{ .StrictSuffix }}/{{ .ResourceKind }}{{ .KindSuffix }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Install kind, kubectl and kubeconform, each checked against its pinned digest
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/k8s-bin"
          mkdir -p "$bin"
          curl -fsSLo "${bin}/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${bin}/kind" | sha256sum --check --strict
          curl -fsSLo "${bin}/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${bin}/kubectl" | sha256sum --check --strict
          curl -fsSLo "${RUNNER_TEMP}/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "$bin" kubeconform
          chmod +x "${bin}/kind" "${bin}/kubectl" "${bin}/kubeconform"
          echo "$bin" >>"$GITHUB_PATH"
      - name: The manifests' copies of deploy/ files match their sources
        run: node --test deploy/k8s/test/files.test.ts
      # Kustomize as built into the pinned kubectl.
      - name: Every manifest is valid Kubernetes 1.37
        run: |
          set -euo pipefail
          kubectl version --client
          for overlay in deploy/k8s/overlays/*/; do
            echo "== ${overlay}"
            kubectl kustomize "$overlay" \
              | kubeconform -strict -summary -kubernetes-version 1.37.0 -schema-location "$KUBECONFORM_SCHEMAS"
          done
          echo "== deploy/k8s/isolation-probe.yaml"
          kubeconform -strict -summary -kubernetes-version 1.37.0 -schema-location "$KUBECONFORM_SCHEMAS" \
            deploy/k8s/isolation-probe.yaml
      # Builds the three images, starts kind, applies the kind overlay with its Secrets, runs the
      # Kubernetes gate, prints every object and every container's log on failure, and deletes
      # the cluster.
      - name: The Kubernetes gate on kind
        run: ./e2e/run-k8s.sh
