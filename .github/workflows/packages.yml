name: packages

# Publishes @askgina/os-keys and @askgina/os-world to GitHub Packages for other repositories.
# Tag `world-v<version>` with the World's version from packages/world/package.json. The key
# package is published at its own version when that version is not on the registry yet.
on:
  push:
    tags: ["world-v*"]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The tag names the World's version
        run: |
          version=$(node -p 'require("./packages/world/package.json").version')
          if [ "world-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match @askgina/os-world $version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/keys
      - run: bun run build
        working-directory: packages/world
      - run: node scripts/pack-packages.mjs
      - run: node scripts/smoke-packed-world.mjs
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # npm reads the token from the environment when it reads this file.
          printf '%s\n' '@askgina:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/publish.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
          for dir in packages/keys packages/world; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            tarball=".packs/$(node -p "require('./.packs/packs.json')['$name']")"
            if [ "$name" = "@askgina/os-keys" ] && npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$tarball"
          done
