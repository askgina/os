# The whole stack. From a fresh clone: `docker compose --profile dev up --build`, then open
# http://localhost:8080. See deploy/README.md for what each part is for.
name: os

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  init:
    image: node:26-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    command: ["node", "/init/init.mjs"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/init:/init:ro
      - server-secrets:/secrets/server
      - signer-secrets:/secrets/signer
      - approve-secrets:/secrets/approve
      - db-secrets:/secrets/db
      - signer-data:/data/signer
    restart: "no"

  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
      - db-secrets:/run/secrets/db:ro
    networks: [control]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  signer:
    <<: *hardening
    image: askgina-os-signer:local
    build:
      context: .
      dockerfile: apps/signer/Dockerfile
    environment:
      SIGNER_PORT: "8787"
      SIGNER_DATA_DIR: /data
      SIGNER_HMAC_SECRET_FILE: /run/secrets/signer/signer-request-secret
      SIGNER_CONFIRM_SECRET_FILE: /run/secrets/signer/confirm-request-secret
      SIGNER_KEY_FILE: /run/secrets/signer/token-key
      SIGNER_VAULT_PASSPHRASE_FILE: /run/secrets/signer/vault-passphrase
      WEBAUTHN_RP_ID: ${OS_HOSTNAME:-localhost}
      # The confirmation page's origin: a host under OS_HOSTNAME, or another port on it. The
      # signer accepts an approval made there and nowhere else, not on the control plane's page.
      SIGNER_APPROVAL_ORIGIN: ${APPROVE_ORIGIN:-http://localhost:8081}
      SIGNER_RETURN_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      SIGNER_CHAINS_FILE: /etc/os/chains.json
      SIGNER_ASSETS_FILE: /etc/os/assets.json
      # The longest life the signer grants a mandate, and how many live mandates one wallet may
      # hold. `:-` also replaces an empty value: the signer refuses an empty number.
      SIGNER_MAX_MANDATE_SECONDS: ${MANDATE_MAX_SECONDS:-604800}
      SIGNER_MAX_LIVE_MANDATES_PER_WALLET: ${SIGNER_MAX_LIVE_MANDATES_PER_WALLET:-16}
      # How long after the first signature a stuck transaction may be repriced with no person
      # asked (0 turns that off), and how many signatures one approval may produce in all.
      SIGNER_REPRICE_WINDOW_SECONDS: ${SIGNER_REPRICE_WINDOW_SECONDS:-86400}
      SIGNER_MAX_TX_ATTEMPTS: ${SIGNER_MAX_TX_ATTEMPTS:-16}
      SIGNER_MIN_DESTROY_DELAY_SECONDS: ${SIGNER_MIN_DESTROY_DELAY_SECONDS:-604800}
      SIGNER_MAX_DESTROY_DELAY_SECONDS: ${SIGNER_MAX_DESTROY_DELAY_SECONDS:-7776000}
    volumes:
      - signer-data:/data
      - signer-secrets:/run/secrets/signer:ro
      - ./deploy/chains.json:/etc/os/chains.json:ro
      - ./deploy/assets.json:/etc/os/assets.json:ro
    # The server and the `approve` service, each on its own internal network, and nothing else.
    networks: [signing, approve-signer]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    <<: *hardening
    image: askgina-os-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      WEBAUTHN_RP_ID: ${OS_HOSTNAME:-localhost}
      PORT: "3000"
      DATABASE_URL: postgres://postgres@postgres:5432/postgres
      DATABASE_PASSWORD_FILE: /run/secrets/server/postgres-password
      KEYRING_FILE: /run/secrets/server/keyring.json
      SIGNER_URL: http://signer:8787
      SIGNER_HMAC_SECRET_FILE: /run/secrets/server/signer-request-secret
      APPROVE_ORIGIN: ${APPROVE_ORIGIN:-http://localhost:8081}
      CHAINS_FILE: /etc/os/chains.json
      # Venues the server posts signed orders to (specs/non-evm-operations.md): the path, inside
      # this container, of a JSON array of { network, apiUrl }; mount the file with an override
      # (deploy/README.md). Empty: no venue, and every venue proposal is refused. Hyperliquid
      # testnet and mainnet are both supported, at most one entry per network; an entry that
      # pairs api.hyperliquid.xyz or api.hyperliquid-testnet.xyz with the wrong network stops
      # the server.
      VENUES_FILE: ${VENUES_FILE:-}
      WEB_DIST_DIR: /app/apps/web/dist
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET_FILE: /run/secrets/server/notify-webhook-secret
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-}
      WEB_PUSH_VAPID_KEY_FILE: /run/secrets/server/vapid-key.pem
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WEB_PUSH_ENDPOINT_HOSTS: ${WEB_PUSH_ENDPOINT_HOSTS:-}
      # The same value as the signer's SIGNER_MAX_MANDATE_SECONDS, from the same .env setting:
      # the server checks a draft against it early, and the signer's check decides.
      MANDATE_MAX_SECONDS: ${MANDATE_MAX_SECONDS:-604800}
      # A transaction that is signed and not mined is signed again with a higher fee, inside the
      # fee ceiling its approval set: whether without asking, after how long, and by how much.
      REPRICE_AUTO: ${REPRICE_AUTO:-1}
      REPRICE_AFTER_SECONDS: ${REPRICE_AFTER_SECONDS:-180}
      REPRICE_BUMP_PERCENT: ${REPRICE_BUMP_PERCENT:-12}
      # Several replicas (specs/beyond-one-machine.md): how long a replica keeps an
      # unwrapped data key (a shred is heard by every replica at once), and how many proxies
      # append to X-Forwarded-For before the server.
      DATA_KEY_CACHE_SECONDS: ${DATA_KEY_CACHE_SECONDS:-60}
      FORWARDED_HOPS: ${FORWARDED_HOPS:-1}
      # Where the keys that wrap data keys live: the keyring file above (`file`), or OpenBao
      # Transit (`openbao`, packages/keys/README.md), which then needs the address, AppRole and
      # the two files below. With both set, keys wrapped under the file still read until
      # `node packages/keys/src/cli.ts rewrap` has moved them. Empty means unset.
      KEY_PROVIDER: ${KEY_PROVIDER:-file}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_AUTH: ${OPENBAO_AUTH:-}
      OPENBAO_TOKEN_FILE: ${OPENBAO_TOKEN_FILE:-}
      OPENBAO_ROLE_ID_FILE: ${OPENBAO_ROLE_ID_FILE:-}
      OPENBAO_SECRET_ID_FILE: ${OPENBAO_SECRET_ID_FILE:-}
      OPENBAO_TRANSIT_MOUNT: ${OPENBAO_TRANSIT_MOUNT:-transit}
      OPENBAO_TRANSIT_KEY: ${OPENBAO_TRANSIT_KEY:-os-kek}
      OPENBAO_CA_FILE: ${OPENBAO_CA_FILE:-}
      OPENBAO_TIMEOUT_MS: ${OPENBAO_TIMEOUT_MS:-2000}
    volumes:
      - server-secrets:/run/secrets/server:ro
      - ./deploy/chains.json:/etc/os/chains.json:ro
    networks: [control, signing, chain]
    depends_on:
      postgres: { condition: service_healthy }
      signer: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # Ready, not only alive: the database answers and this replica delivers Workflow steps.
        # Both edges wait for it before they start.
        - "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
    # The Workflow queue gives in-flight deliveries 5 seconds after SIGTERM; a little more lets
    # the process exit on its own instead of being killed. A step that was interrupted anyway is
    # run again about half a minute after the server is back.
    stop_grace_period: 10s
    restart: unless-stopped

  # The confirmation page and its relay to the signer's confirm routes. It holds no key, and
  # its secret reaches no other signer route. Only Caddy reaches it; it reaches only the signer.
  approve:
    <<: *hardening
    image: askgina-os-approve:local
    build:
      context: .
      dockerfile: apps/approve/Dockerfile
    environment:
      PORT: "8788"
      APPROVE_ORIGIN: ${APPROVE_ORIGIN:-http://localhost:8081}
      SIGNER_URL: http://signer:8787
      APPROVE_SIGNER_SECRET_FILE: /run/secrets/approve/confirm-request-secret
    volumes:
      - approve-secrets:/run/secrets/approve:ro
    networks: [approve-edge, approve-signer]
    depends_on:
      init: { condition: service_completed_successfully }
      signer: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  caddy:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    # The Caddy binary carries this file capability. Some container runtimes refuse to start a
    # binary whose file capability is outside the allowed set, so it is granted back.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/tmp", "/data", "/config"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      # The confirmation page, on its own origin.
      - "127.0.0.1:${APPROVE_HTTP_PORT:-8081}:8081"
    networks: [edge, control, approve-edge]
    depends_on:
      server: { condition: service_healthy }
      approve: { condition: service_healthy }
    restart: unless-stopped

  agent-gateway:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/tmp", "/data", "/config"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost:8080}
    volumes:
      - ./deploy/Caddyfile.agents:/etc/caddy/Caddyfile:ro
    networks: [agents, control]
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped

  anvil:
    profiles: [dev]
    image: ghcr.io/foundry-rs/foundry:stable@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    networks: [chain]
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Not started by `up`: it needs a token. Run it with
  #   docker compose run --rm -e AGENT_TOKEN=... -e TRANSFER_TO=0x... scripted-agent
  scripted-agent:
    profiles: [agent]
    image: askgina-os-scripted-agent:local
    build:
      context: .
      dockerfile: examples/scripted-agent/Dockerfile
    # Variables without a value are passed through only when set at `docker compose run -e`.
    environment:
      - MCP_URL=http://agent-gateway/mcp
      - AGENT_TOKEN
      - TRANSFER_TO
      - AMOUNT
      - CHAIN_ID
      - MEMO
    networks: [agents]
    depends_on:
      agent-gateway: { condition: service_started }

networks:
  edge: {}
  control: {}
  chain: {}
  signing:
    internal: true
  # Caddy to the `approve` service.
  approve-edge:
    internal: true
  # The `approve` service to the signer.
  approve-signer:
    internal: true
  agents:
    internal: true

volumes:
  postgres-data: {}
  signer-data: {}
  server-secrets: {}
  signer-secrets: {}
  approve-secrets: {}
  db-secrets: {}
